# 主搜索界面配色；修改后刷新页面生效，无需修改 Python。颜色须加引号。
# default: light（明色）或 dark（暗色）；页面右上角可临时切换，刷新回到默认。
# 色值支持 #RGB、#RRGGBB、#RRGGBBAA；最后两位为透明度。
# primary/secondary/accent：品牌色；page/surface/section-*：页面、卡片、分区。
# text/muted/subtle：正文与辅助文字；*-bg/border/text：状态及标签配色。
# blue/green/purple/pink/orange/teal/amber/red：分类与通用彩色控件。
# on-color：彩色实底上的文字；action-*：搜索按钮；tooltip-*：悬浮提示。
# 保持浅色背景配深字、深色背景配浅字；两套主题的键名必须一致。
default: light
light:
  primary: '#4a90e2'
  secondary: '#5e6c84'
  accent: '#ff6b6b'
  page: '#ffffff'
  surface: '#ffffff'
  section-surface: '#f8fafc'
  section-border: '#dbe4ee'
  cell-border: '#e2e8f0'
  section-heading: '#334155'
  text: '#334155'
  muted: '#64748b'
  subtle: '#888'
  link: '#2563a8'
  link-hover: '#174f86'
  info-bg: '#eff6ff'
  info-border: '#bfdbfe'
  info-text: '#1d4ed8'
  success-bg: '#ecfdf5'
  success-border: '#a7f3d0'
  success-text: '#047857'
  # 独立控制「服务可用」和「已选标签」区域，避免影响其他成功提示。
  service-ready-bg: '#ecfdf5'
  service-ready-border: '#a7f3d0'
  service-ready-text: '#047857'
  selection-bg: '#eff6ff'
  warning-bg: '#fff7ed'
  warning-border: '#fed7aa'
  warning-text: '#c2410c'
  danger-bg: '#fef2f2'
  danger-border: '#fecaca'
  danger-text: '#b91c1c'
  notice-bg: '#fff8e1'
  notice-border: '#ffcc80'
  notice-text: '#7c4a03'
  notice-action: '#ff8f00'
  notice-hover: '#fff3cd'
  notice-close: '#a85d00'
  chip-bg: '#e3edf7'
