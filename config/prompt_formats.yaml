  # Graphic Design & Layout Art Direction Specification

  本规范用于指导 AI 生成平面设计作品（海报、书籍/唱片封面、杂志版式、品牌视觉、包装平面、UI/卡片、矢量图形与排版设计）时的版面规划、视觉层级、字体排印、色彩体系与材质表现。最终输出的语言、格式与模型特定语法由下游模型规范或调用方指定。

  ## 核心设计原则

  1. **二维版面优先于三维透视**：平面设计的核心是画布平面（2D Canvas）上的元素组织、网格对齐与比例分割。除非明确要求 3D 视觉主图或样机展示（Mockup），否则默认采用正交平视视角（Flat-lay / Orthographic Front View），禁止无故将整个版面倾斜或放入透视空间。
  2. **扁平展示 vs 实体样机（Flat vs. Mockup）分离**：
     - 用户未明确要求“样机、摆拍、手持、张贴在墙上”时，默认生成**满画幅纯平面设计稿（Full-bleed 2D Graphic Design）**，画框边缘即设计稿裁切边缘。
     - 严禁为了增加所谓“真实感”擅自添加木桌背景、咖啡杯、绿植阴影、画框边缘或褶皱背景墙。
  3. **信息层级与视觉动线（Visual Hierarchy & Eye Flow）**：版面必须具备清晰的阅读顺序（第一视觉落点 → 核心标题 → 视觉辅助图形 → 次要信息/角标）。任何装饰元素不得干扰核心标题与主图形的辨识度。
  4. **负空间即设计元素（Active Negative Space）**：留白不是“未填满的区域”，而是用于控制视觉呼吸感、建立高级感与分割信息块的核心结构。禁止用零碎装饰填满所有角落。
  5. **文字可渲染性控制**：AI 对长文本和微小字体的渲染能力有限。凡需要精确可读的文字，必须精简字数、明确字形风格与空间位置；但是用户指定必须准确呈现的文字，保留原文，不得擅自删减或转为纹理；

  ---

  ## 组装前版面规划

  在生成具体提示词前，必须完成以下两条规划链路：

  **1. 视觉层级与网格链路：**
  `设计载体是什么（海报/封面/标志/包装）` → `版式架构模式是什么` → `第一视觉锚点（主图或主标题）位于哪里` → `网格如何划分区域` → `留白占比多少` → `阅读视线如何流动`

  **2. 风格与媒介质感链路：**
  `设计流派/美学风格` → `图形表现手法（矢量/摄影拼贴/3D渲染/粗野主义）` → `色彩对比与面积配比` → `印刷工艺与纸张基底质感`

  ### 版式架构模式（四选一）

  组装前必须明确选择一种版式架构，不得混用导致重心瓦解：

  - **字体主导型（Typography-Driven）**：巨大、极具表现力的字体排印本身就是第一视觉主体（占版面 50%～80%），图形仅作为穿插、点缀或底纹。
  - **主图主导型（Key-Visual / Hero-Image Driven）**：核心高冲击力图形、插画或摄影拼贴占据主导（60%～85%），文字以精炼标题、角标或环绕形式配合主图。
  - **网格分割型（Modular Grid / Swiss Style）**：版面由严格的不对称网格、线条、色块或几何容器分割，图文各居其位，强调秩序感、对齐关系与几何比例。
  - **极简留白型（Minimalist / Negative-Space Driven）**：大面积纯色或肌理留白占据画幅（60%～85%），核心图形与排印高度浓缩在特定视觉焦点（如黄金分割点或绝对中心），依靠极致的尺度对比建立张力。

  ---

  ## 版式构图与网格规则

  ### 网格系统与对齐逻辑

  平面描述必须使用明确的版面坐标与几何关系词汇，避免模糊的方位词：

  - **网格结构**：明确指定采用居中对称（Centered Symmetry）、瑞士国际主义网格（Swiss Modular Grid）、双栏/三栏分割（Two-column / Three-column Split）、对角线张力（Diagonal Tension）或边缘环绕（Frame / Border Layout）。
  - **对齐与边界**：使用 `flush left`（左对齐）、`centered alignment`（居中对齐）、`justified block`（两端对齐块）、`anchored to the four corners`（四角锚定）、`bleeding off the right edge`（右侧出血裁切）等精确描述。
  - **尺度对比（Scale Contrast）**：通过极大与极小的悬殊对比拉开层级。例如：`massive oversized headline spanning the full width` 配合 `tiny micro-typography metadata aligned vertically along the left margin`。

  ### 主图形与正负形关系（Figure-Ground Relationship）

  - **单焦点原则**：版面中只允许存在一个核心图形焦点。若包含多个次要元素，必须收纳进统一的网格容器或拼贴轮廓中，禁止元素散乱漂浮。
  - **图底分离与穿插**：
    - 图形与背景必须具备高可辨识度的明度差或色相差。
    - 若采用图文穿插（Text-Image Interplay），须明确前后遮挡逻辑（如：`the subject's silhouette partially overlaps the giant bold title behind it`，但保留文字足够的可识别轮廓）。
    - 鼓励使用正负形反转（Figure-Ground Reversal）或双重曝光剪影（Double-exposure Silhouette）来精炼视觉概念。

  ### 留白与视觉呼吸感

  | 版式密度类型 | 有效留白（负空间）占比 | 适用场景 |
  |---|---:|---|
  | 极简/奢侈品/艺术展海报 | 60%～85% | 强调克制、静谧、高级感与单一符号冲击力 |
  | 现代标准商业海报/封面 | 30%～55% | 主图清晰、标题突出、阅读舒适 |
  | 瑞士网格/信息图表/杂志内页 | 20%～35% | 信息量大，依靠网格线、分栏与色块建立秩序 |
  | 酸性设计/拼贴/地下音乐海报 | 5%～20% | 有意采用高密度视觉轰炸（Maximalism），但必须靠色彩主次或粗大轮廓维持核心焦点 |

  ---

  ## 字体排印规范（Typography & Lettering）

  在 AI 提示词中，文字必须同时定义**“写什么内容”**与**“长什么视觉形态”**：

  ### 1. 需精确渲染的核心文本（Exact Text）

  - **文本声明**：需要准确拼写的标题或单词，必须使用英文双引号 `""` 严格包裹（如 `the bold text "SILENCE"`）。
  - **字数控制**：单张设计图中要求精确拼写的独立文本块不宜超过 2～3 处，总词数控制在极简范围，避免生成长句拼写乱码。
  - **字形定义（Typeface Specification）**：必须具体说明字体类别与字重，不得只写 `text` 或 `title`：
    - **无衬线（Sans-Serif）**：`ultra-bold geometric sans-serif`、`condensed grotesque headline`、`clean neo-grotesque typography`
    - **衬线（Serif）**：`high-contrast editorial didone serif`、`sharp transitional serif`、`elegant italic serif`
    - **展示与手写（Display & Script）**：`custom liquid chrome lettering`、`brutalist distressed stencil font`、`expressive brush calligraphy`、`pixel bitmap font`
    - **等宽与技术感（Monospace）**：`technical monospace data type`、`industrial label typography`

  ### 2. 装饰性与结构化文本块（Structural / Greeking Typography）

  对于不要求逐字阅读、仅用于丰富版面细节的副标题、日期、内文段落或角标，禁止输入冗长的真实句子，应直接描述其**几何视觉形态**：
  - `a compact block of fine-print editorial body copy in the lower-left corner`
  - `vertical micro-typography running along the right border`
  - `minimalist typographic registration marks, barcode, and issue numbers in the header`

  ### 3. 文字可读性保护

  - 文字跨在复杂图形之上时，必须指定可读性保护措施：如高反差纯色（白字压暗底）、反相混合效果（Difference Blend Mode）、色块衬底（Solid Pill Container / Banner Box）或干净的负空间区域。
  - 严禁将细体字直接放置在碎裂、高对比的复杂纹理之上。

  ---

  ## 色彩体系与面积配比

  平面设计的色彩重在**色块面积对比、明度反差与专色质感**，而非自然环境光漫反射：

  1. **严格限制色盘数量**：明确指定配色方案（如双色调 Duotone、三原色 Bauhaus Primary Palette、单色明度渐变 Monochromatic、高反差黑白加单一荧光强调色 Black & White with Acid Green Accent）。
  2. **明确面积配比（60-30-10 或极端反差法则）**：
     - **基底色（Dominant Base）**：定义画布底色或最大色块（如 `matte off-white paper base`、`deep cobalt blue background`）。
     - **主体色（Secondary Structure）**：定义主图形或网格块的色彩。
     - **强调色（Focal Accent）**：仅用于核心标题、关键符号或视觉引导点的小面积高锐度颜色（如 `a sharp vermilion red accent on the title and stamp`）。
  3. **印刷色彩模式表达**：根据风格需要，可使用印刷与平面专属色彩词汇，如 `Pantone spot colors`、`high-contrast CMYK color separation`、`fluorescent neon ink`、`muted earthy risograph inks`。

  ---

  ## 材质、工艺与表面肌理（Tactility & Print Finish）

  优秀的平面设计提示词需要消灭廉价的“数码生硬感”，通过媒介与印刷工艺描述赋予画面物理质感（即使在 2D 平视构图中也完全可见）：

  - **纸张与基底肌理**：`uncoated textured cotton paper`、`heavyweight matte cardstock`、`vintage yellowed newsprint`、`raw industrial kraft paper`、`sleek glossy magazine stock`。
  - **印刷与油墨特征**：
    - **孔版/丝网印刷（Risograph / Screenprint）**：`authentic risograph print texture`、`subtle ink overprint misalignment (registration shift)`、`halftone dot patterns`、`grainy ink stippling`。
    - **传统凸版/凹版（Letterpress / Embossing）**：`debossed letterpress typography`、`blind embossing`。
    - **现代特种工艺（Specialty Finishes）**：`holographic foil stamping`、`metallic gold leaf accents`、`spot UV gloss contrast against a matte base`。
  - **复古与做旧痕迹（仅在风格需要时使用）**：`subtle xerox photocopy noise`、`high-contrast threshold distress`、`folded poster crease lines`（若要求纯净矢量或现代商业稿，则明确声明 `clean vector precision, zero distressed noise`）。

  ---

  ## 八维平面设计表现力检查

  在完成基础版面组装后，自查以下 8 个平面设计维度，**至少触发 4 个维度以上**。缺失的维度通过自然语言描述层补全，且补全内容必须服务于整体设计风格：

  | 维度 | 检查问题 | 缺失表现 | 补全方向 |
  |---|---|---|---|
  | **层级 (Hierarchy)** | 第一眼看哪里、第二眼看哪里是否明确？ | 所有元素一样大，文字与图形互相抢戏 | 拉开主标题、主图与辅助文字的尺寸差距（极大 vs 极小） |
  | **网格 (Grid)** | 元素排列是否有内在几何秩序？ | 元素随意漂浮，边距不统一 | 明确对齐方式（左对齐/居中/四角锚定）、分栏比例或分割线 |
  | **排印 (Typography)** | 字体是否有明确的性格与形态？ | 默认无聊字体，或文字糊成一团 | 指定具体字形（如高对比衬线/粗野无衬线）、字间距与排版方向 |
  | **正负形 (Figure-Ground)** | 留白是否参与了构图？ | 画面塞满或留白松散无力 | 明确负空间占比、剪影轮廓切割或图底反转关系 |
  | **比例 (Scale & Tension)** | 元素之间是否有戏剧性的尺度反差？ | 尺寸平庸，缺乏视觉张力 | 巨型出血裁切图形/字体 vs 精密微小的信息角标 |
  | **配色 (Color System)** | 色彩面积与主次是否受控？ | 颜色杂乱无章，缺乏统一调性 | 限定 2～4 种核心色，明确基底色、主体色与小面积高饱和强调色 |
  | **肌理 (Print Tactility)** | 画面是否有媒介与工艺质感？ | 廉价平滑的数码塑料感 | 补充纸张纹理、半调网点、丝网印刷叠印、噪点颗粒或烫金工艺 |
  | **符号感 (Iconography)** | 视觉概念是否高度凝练？ | 变成普通写实摄影或琐碎插画 | 提炼几何形态、高反差剪影、抽象图形符号或超现实拼贴组合 |

  ---

  ## 平面设计冲突检查表

  输出前必须逐项排查并消解以下常见平面生成冲突：

  | 冲突对 | 消解规则 |
  |---|---|
  | 2D 纯平面稿 vs 3D 样机摆拍 | 严格二选一。默认使用 `flat 2D graphic design, full-bleed artwork`，严禁混入桌面、墙面透视或环境杂物 |
  | 极简主义 (`minimalist`) vs 高密度拼贴 (`maximalist collage`) | 选定唯一版面密度，不得同时要求“大片留白”和“塞满复杂细节” |
  | 扁平矢量 (`flat vector`) vs 写实摄影景深 (`shallow depth of field / bokeh`) | 扁平平面稿禁止出现镜头背景虚化（Bokeh）；仅当主图本身是摄影局部时才可限定在主图框内使用 |
  | 自然环境光照 vs 平面图形配色 | 2D 版式不描述“夕阳从左侧照亮海报”，只描述画面内图形本身的明暗、渐变或油墨色彩 |
  | 精确拼写文本 vs 冗长段落 | 引号内的精确渲染文本必须简短；长段文字一律改写为视觉排版纹理（`micro-type block`） |
  | 复杂底图 vs 细小文字 | 文字覆盖区域必须保持干净或添加高反差衬底，防止文字与背景纹理粘连 |
  | 出血构图 (`full-bleed`) vs 留白外框 (`white border margin`) | 明确画幅边缘是直接裁切色块/图形，还是四周保留统一的留白边框 |

  ---

  ## 平面设计最终自检清单

  输出前确认以下要素：

  1. 是否已明确定义这是**满画幅 2D 纯平面设计稿**还是**带有环境透视的 3D 实物样机**（默认前者，且排除了无关环境背景）？
  2. 是否只选择了一种版式架构模式（字体主导、主图主导、网格分割或极简留白），且第一视觉焦点唯一？
  3. 版面中的网格划分、对齐方式（居中/左对齐/四角锚定）和留白区域是否交代清楚？
  4. 需要精确显示的文字是否已精简并用双引号包裹？是否明确指定了字体的具体形态（衬线/无衬线/字重/风格）与可读性对比保护？
  5. 装饰性小字、角标和辅助信息是否已转化为结构化排版形态描述，而非堆砌无法渲染的长句？
  6. 色彩系统是否明确了基底色、主体色和强调色的面积配比，避免了互不相容的杂乱调色词？
  7. 是否根据设计风格补充了恰当的媒介质感（如纸张纹理、丝网印刷网点、瑞士平滑矢量或特种工艺），并消除了不属于平面设计的镜头虚化与外部环境光干扰？
  8. 是否已通过“平面设计冲突检查表”与“八维平面设计表现力检查”（至少触发 4 维）？

# MCP 和 REST 共用规范；修改配置后重启服务生效。
art_direction: |2-
  # 通用视觉构图与创作规范

  本规范用于指导 AI 绘图提示词的艺术设计，包括画面规划、空间组织、光影色彩设计、叙事因果外化及多主体特征分配。
  最终输出的语言、格式与模型特定语法由下游模型规范或调用方指定。

  ## 核心创作原则

  1. **视觉主次明确**：第一视觉主体可以是人物、建筑、环境或道具；人物也可以只承担尺度标尺、色彩焦点或情绪入口。
  2. **镜头与尺度控制**：当人物需要清晰可读时，复杂环境描述容易拉远镜头，因此必须同时明确人物大小、人物功能和环境层级。“全身可见”只表示身体完整纳入取景框，不代表人物会占据主要画面。
  3. **忠实用户意图与创作补全原则**：在保留用户明确设定与画面主题的前提下，可适度补全未指定的视觉细节。新增内容应服务于构图、空间、光色或场景完整性，不得喧宾夺主，不得擅自改变人物关系、叙事主题或主要情绪。用户要求极简、限定元素或仅转换格式时，严格控制新增内容。
  4. **瞬间、因果与物理逻辑**：
     - **单一可见瞬间**：有剧情或动作时，只选择一个最具表现力的可见瞬间，不描述连续事件。
     - **安静日常保护**：安静日常场景保持自然舒展，不强制添加内在冲突、夸张动势或戏剧性光影。
     - **因果可见性（Causal Visibility）**：
       - 画面中若存在动作或叙事，必须符合“事件起因 → 角色反应 → 可见物理后果”的逻辑，看不见视觉后果的抽象设定不写。
       - **情绪外化**：角色情绪必须落到具体的微表情、视线、手势、身体重心或角色间距离变化上，避免空洞的情绪词或千篇一律的假笑。
       - **精确接触**：手部与肢体动作必须明确接触对象、接触位置和产生的物理结果（如挤压变形、衣料褶皱、持握方式）。
       - **环境与天气联动**：用户已要求的风、雨、雾、雪、夕阳、霓虹或植物等环境与季节因素，不能只作为概念存在，必须对角色、道具、服装、头发或构图层次产生至少一个符合逻辑的可见物理影响（如衣物飘动、发丝沾水、地面倒影、轮廓光或表面覆盖）；不得为满足本规则擅自添加新环境因素。

  ---

  ## 组装前画面规划

  在生成具体提示词前，必须按以下链路完成画面确认：

  第一视觉主体与情境瞬间是什么 → 构图模式是什么 → 主要视觉锚点位于哪里 → 人物承担什么功能与反应 → 前中远景如何组织 → 主光与色彩如何建立主次

  构图模式只选择一种：

  - **人物主导**：人物是第一视觉主体，环境辅助人物。
  - **人景平衡**：人物与主要环境锚点都清楚可读，彼此不吞没。
  - **环境／建筑主导**：银河、巨构、城市或其他环境对象是第一视觉主体，人物可以退居次要位置。
  - **小人物尺度锚点**：人物主要用于证明环境尺度或提供叙事入口，只需轮廓、位置、朝向和关键识别点可读。

  ---

  ## 构图与空间规则

  ### 景别、主视觉与主体大小

  第一视觉主体、景别（取景范围）和人物占比必须分别确定：

  - **取景范围与可见性裁剪**：特征描述必须与最终景别严格一致。用户已有设定即使本身正确，只要对应内容不会出现在当前取景范围内，或被其他物体完全遮挡（如戴眼罩时不可见的瞳色），也必须剔除，不得将不可见的特征写入提示词：
    - **特写 (Close-up)**：优先保留脸部、发型、头部饰品和表情，删除画面外的身体、下装、腿部、鞋袜及全身姿势描述。
    - **半身 (Upper body)**：保留上半身服装、手臂和画面内可见动作；删除裙子、裤子等下装细节，以及腿部姿势、袜子、长筒袜和鞋子描述。
    - **七分身 (Cowboy shot / 大腿以上)**：可以保留可见的下装，通常删除袜子、鞋子、脚部动作及依赖完整身体的姿势描述。
    - **全身 (Full body)**：身体、下装、腿部和鞋袜均实际可见时，才保留对应描述。

  参考主体占比范围：

  | 人物功能 | 人物占画面高度 |
  |---|---:|
  | 人物主导 | 65%～85% |
  | 人景平衡 | 40%～65% |
  | 环境中的可读人物 | 20%～40% |
  | 纯尺度／叙事锚点 | 8%～25% |

  不必机械输出百分比，可使用具体视觉描述。如果模型支持，也可以使用BBOX等技术框定对应内容。
  - `the character dominates the frame`
  - `the seated figure occupies about two-thirds of the frame height`
  - `the full body remains large and clearly readable`
  - `the megastructure dominates the central skyline`
  - `the entire left side opens into a luminous star field`
  - `a small figure in the lower-right foreground provides a clear sense of scale`

  ### 默认构图与画幅填充

  - 用户没有要求环境主视觉时，默认采用**人物主导**构图，默认近景/中近景且人物面向观众（若用户有描述则以用户描述为准）。
  - 人物主导或人景平衡的全身图必须完整显示身体、鞋子和必要的承载物，但不得默认缩成远景小人物；用户明确要求小人物尺度锚点时除外。
  - 坐姿全身图可以显示完整椅子，但人物仍应是主要视觉焦点。
  - 已知画幅比例时，构图必须与画幅匹配。横向全身图不得用大量空白、墙壁或黑暗物体填充两侧。
  - 宽画幅中人物位于左侧或右侧时，必须使用用户已有的环境元素明确填充另一侧及中间区域；除非用户要求留白或极简构图，不得留下未定义的大面积纯色空间。
  - 巨构、银河、高架等第一视觉主体可以有意突破画框来表达尺度；人物裁切仍必须服从既定景别，不得把意外裁切解释成尺度设计。

  ### 主视觉与环境层级

  - 只确定一个主要视觉锚点，其余人物、环境和道具按构图模式承担辅助、尺度或叙事作用。
  - 人物主导时，窗户、太阳、极光、霓虹等高亮环境不得压过人物；人景平衡时，两者都要清楚可读。
  - 环境／建筑主导或小人物尺度锚点模式中，主要环境可以拥有最高视觉优先级，但人物仍须满足其既定功能所需的可读性。
  - 环境复杂时，必须同时说明主要视觉锚点、人物占比、画面分区和各层级主次，不能只把所有元素列为并列背景。
  - 环境描述不要只写 `behind the character`、`recedes into the background` 或整体 `softly blurred`；应使用画面左／右／中央／上／下与前景／中景／远景建立构图地图，说明主要环境锚点占据画面的哪一侧、哪个深度层级和多大区域，并仅让最远处细节轻微虚化。
  - 用户明确要求的主要环境必须清晰可辨，不能变成纯色或被整体严重虚化。
  - 环境元素不得无故延伸到镜头前方形成狭窄通道；用户明确要求且用于框景、引导线、尺度或世界观表达时，可以进入前景。

  ### 前景限制

  - 不得为了增加空间感自动添加前景遮挡。
  - 除非用户明确要求，不得生成大片黑暗前景、严重遮挡、门框式夹景或隧道式构图。
  - 用户明确要求的起重机、植物、高架、门框等前景，以及大片暗部或物体出框，只有在承担框景、引导线、尺度、遮光或世界观表达时才可保留。
  - 前景不得无故遮挡第一视觉主体；人物主导时不能遮挡脸、手、主要动作或大部分身体，小人物尺度锚点模式中不能破坏人物轮廓和朝向的可读性。
  - 需要空间层次时，优先使用中景、背景、正负空间、引导线和景深。

  ### 视线与物理冲突消解

  - **视线逻辑**：
    - 肖像或无明确动作对象时，可以默认看向观众，并确保脸部清晰。
    - 阅读、工作、睡眠、观察道具等场景，视线必须服从当前动作。
    - 用户要求背影、侧脸或看向画外时，以用户要求为准。
    - 多人物场景根据互动关系确定视线（如对视、单向注视、共同看向某物），不强制看向观众。
  - **物理与空间冲突检查**：输出前必须逐项消解互斥描述：
    - 人数冲突：单人（`solo`）与多人互动不共存。
    - 景别冲突：特写（`close-up`）与全身（`full body`）不共存。
    - 视角冲突：俯视（`from above`）与仰视（`from below`）不共存。
    - 朝向冲突：正面（`from front`）与背面（`from behind`）不共存。
    - 视线冲突：看向观众（`looking at viewer`）与背对镜头（`facing away`）或闭眼（`closed eyes`）不共存。
    - 肢体与状态冲突：张嘴与闭嘴、手指张开与握拳、双腿分开与并拢、完全裸露与具体服装，以及同一动作的多个互斥姿态不共存。也包括因为遮挡而导致不可见的身体部位或不可能实现的动作。比如如果人物戴着 `blindfold` ，就应该删去 `green_eyes` 和 `looking_at_viewer`。
    - 光源与空间冲突：室内光源与室外背景必须同处合理空间（如通过窗户衔接），不得出现无逻辑的跨空间光照冲突。

  ---

  ## 光照、曝光与色彩

  光照描述应按以下链路明确：

  主光源 → 光线方向 → 照亮的主体部位 → 背景光作用 → 暗部细节

  ### 主体曝光

  - 需要正常可见的人物图，应明确脸、眼睛、手或关键服装被主光照亮。
  - 窗户、夕阳、极光、霓虹位于人物背后时，必须说明它是背景光或轮廓光。
  - 强背景光（背光）场景如果要求人物清晰，必须增加正面或侧前方主光、柔和补光或轮廓保护。
  - 除非用户明确要求剪影，否则人物不能完全落入死黑暗部。
  - 必要时明确描述：`well-exposed subject`、`visible facial features`、`clear details in the shadows`、`no silhouette`。

  ### 有意剪影

  - 用户明确要求剪影时，先确定是完全黑色剪影，还是保留少量服装、发型或暗部细节的可读暗色人物。
  - 剪影轮廓必须与背景分离，发型、姿势、朝向和承担叙事作用的关键外形应可辨认。
  - 人物可以作为第一视觉主体，也可以只作为尺度锚点；若剪影本身就是目标，不强制增加会破坏剪影意图的正面补光。

  ### 低照度与温馨氛围区分

  - 低照度（`dim lighting`）不等于温馨或柔和，只有用户明确要求昏暗、低调光、压抑氛围或剪影时才使用。
  - 温馨室内场景优先使用：`soft warm interior light`、`gentle warm key light`、`cozy ambient lighting`。
  - 夜景中需要人物清晰时，必须同时指定照亮人物的光源。

  ### 色彩角色

  - 确定一个主色倾向和最多两个辅助色，并说明每种颜色绑定的对象或画面区域。
  - 明确大面积环境色、过渡色带、小面积强调色和中性色骨架分别由什么承担；这些角色不要求各自使用不同色相。
  - 冷暖对比必须说明哪一方占主导，以及强调色出现在哪个具体物体上。
  - 人物主导时，高饱和环境色不得压过人物肤色、眼睛和关键服装；环境主导时，高饱和环境可以成为第一视觉焦点，但人物应通过轮廓、位置或小面积强调色保持其既定功能。
  - 避免同时堆叠多个互相竞争的调色词，却不说明主次。
  - 用户要求明亮画面时，应明确使用 `bright`、`luminous`、`well-exposed` 或 `clear midtones`。

  ---

  ## 多人物空间与特征分离规则

  多人物场景必须通过清晰的角色边界、空间定位和代表性特征绑定来减少特征混淆（串色）：

  1. **明确精确人数与性别构成**：起始即固定画面中的精确人数与性别构成，不得与单人描述混用，也不得用模糊的“多人”代替已知的精确人数。
  2. **先建立角色锚点，再描述互动**：先按角色分别固定空间位置、身份和外观特征，完成所有角色锚定后，再用独立句子说明角色间的互动。
  3. **空间位置以画面/观众视角为基准并保持稳定**：使用 `on the left side of the image`、`on the right side of the image`、`in the center`、`in the foreground`、`in the background`。不要混用画面左右与角色自身左右；后文不得交换已分配的位置。
  4. **各类别至少一个代表性特征**：每个角色在设定中存在且在当前景别中可见的发型、上衣、下装、鞋袜、道具、姿势类别，各至少写一个代表性特征。某类别本来不存在，或因特写、半身等景别不会出现在画面中时，不得为了凑齐类别而编造或保留画面外特征。
  5. **每类只保留少量高区分度特征**：在满足上一条的前提下，每个可见类别通常只选择一个最有辨识度的代表性特征；只有人物识别确实需要时，同一类别才增加第二个。角色相似、人数达到3人以上或互动复杂时，应删除同类别的次要细节和不必要的同时动作，但不得删掉某个实际存在且可见类别的唯一代表性特征。
  6. **互动描述必须明确主语和宾语**：明确写出动作发起者、承受者、接触对象和视线方向（如 `Character A holds Character B's right hand`、`Character B looks at Character A`）。避免连续使用含义不明的代词（`she`、`he`、`they`），避免用笼统的 `interacting`、`together` 代替可见动作。
  7. **区分专属属性与共享属性**：专属外观、服装、表情和道具必须严格绑定在对应角色名下；两人共有的服装、姿势或环境状态使用 `Both characters...` 单独说明，不得复制成含混的全局属性。

  ---

  ## 画面表现力八维补全参考

  组装完成后，可对照以下 8 个视觉维度自查（建议在自然语言描述层中**至少触发 3 维以上**，但补全内容必须严格服务于用户既有设定，严禁凭空捏造无关元素或违背前景限制）：

  | 维度 | 检查问题 | 缺失表现 | 视觉化补全方向 |
  |------|----------|----------|----------------|
  | **互动** | 元素之间有无行为或物理联系？ | 各自独立摆拍，零交集 | 多人：对视、触碰、动作呼应；单人：与环境/道具互动（扶帽、踩水、光影落于脸侧） |
  | **情感** | 表情与肢体传递了什么具体情绪？ | 空洞假笑 / 面无表情 | 微表情、身体语言（身体前倾、缩肩、指尖轻触、放松依靠） |
  | **视线** | 目光或视觉引导线指向哪里？ | 视线呆滞或方向不明 | 明确看向观众、角色间对视、注视手中道具、看向画外特定方向 |
  | **联动** | 环境与光线是否作用于主体？ | 环境像纯平面背景板 | 风吹动发丝衣角、光线勾勒边缘塑型、材质受环境湿度或色温影响 |
  | **动势** | 画面姿态是否有自然的重心与生机？ | 僵硬对称的立绘感 | 自然重心偏移、布料垂坠或摆动、头发轻扬、动作趋势 |
  | **空间** | 有无清晰的前后层次与呼吸感？ | 元素平铺直叙、拥挤贴脸 | 中景/背景分区、远景适度景深虚化、正负空间留白、空间引导线 |
  | **质感** | 关键材质有无真实物理细节？ | 塑料感 / 缺乏表面细节 | 金属/水面反光、织物纹理、丝滑垂坠、玻璃通透感、水珠凝结 |
  | **因果** | 动作或状态是否有可见的物理结果？ | 动作悬空、缺乏接触反馈 | 手部握持的挤压感、风吹起的折痕、动作引起的姿态反馈 |

  ---

  ## 视觉逻辑自检清单

  输出前确认以下画面要素：

  1. 是否只有一个明确的第一视觉主体，并选择了人物主导、人景平衡、环境／建筑主导或小人物尺度锚点中的一种构图模式？
  2. 是否只有一个明确景别与视角；人物大小、画面位置和承担的主体、尺度、色彩或叙事功能是否一致？是否已剔除当前取景框不可见或被遮挡的身体与服装特征？
  3. 主要视觉锚点、人物和重要环境是否都有明确的画面方位、占据区域和前景／中景／远景归属？
  4. 是否只确定一个主要环境锚点，其余环境、人物和道具均按构图模式承担清楚的辅助作用？光源与背景是否处于同一合理空间？
  5. 前景、框景、大片暗部和物体出框是否具有明确作用，并避免意外遮挡第一视觉主体或破坏人物轮廓、脸、手和主要动作？
  6. 是否明确主光源、光线方向、被照亮或形成剪影的对象，以及暗部需要保留的细节？背光场景是否已补充面部受光保护？
  7. 夜景或背光场景中的剪影是用户要求的有意设计，还是应当通过主光或补光避免的意外结果？
  8. 大面积环境色、过渡色带、小面积强调色和中性色骨架是否绑定了具体区域或物体，并符合当前构图模式的视觉优先级？
  9. 用户已要求的风、雨、雾、夕阳、霓虹或植物是否产生了符合画面逻辑的可见物理影响，且没有为补全效果擅自添加新元素？
  10. 动作、视线、姿势、手部接触关系是否符合因果可见性与物理逻辑；多人物时，人数、角色方位、独立特征绑定、动作主宾语归属是否清楚？

anima: |2-
  # Anima Hybrid Prompt Format Specification

  本规范仅约束 Anima 模型输入提示词的语法结构、标签工程与双层协同规则；画面的构图、空间、光影、色彩与多人物视觉逻辑须遵循《通用视觉构图与创作规范》。最终回答的包装、说明语言、解释及翻译要求由调用方指定。

  ## 核心语法原则

  Anima 同时理解 Danbooru 标签和自然语言，采用两层混合（Hybrid）输入结构：

  - **第一层（Hard Tags）**：负责人物身份、外观、服装、动作、道具和简洁场景锚点。
  - **第二层（Natural Language）**：负责第一视觉主体、构图模式、主体占比、画面分区、空间关系、光照、曝光和色彩。
  - **跨层边界**：
    - 同一概念不在 Hard Tags 和 Natural Language 中机械重复（多人物特征归属锚定除外）。
    - `full body` 等景别标签只控制取景可见范围，不能保证人物在画面中的实际占比大小。
    - 权重语法只能强化具体标签，不能代替 Natural Language 中的构图、主体占比、属性归属和曝光描述。

  ---

  ## 模型输入结构

  模型输入先放单行、逗号分隔的 Hard Tags，空一行后放 Natural Language 段落。

  [Hard Tags: 单行，逗号加空格分隔]

  [Natural Language: 单一段落，按场景复杂度控制句数]

  ---

  ## 第一层：Hard Tags 规范

  使用用户已提供或经检索确认的逗号分隔 Danbooru 标签。

  ### 职责范围

  **包含：**
  - 质量、年代和安全分级
  - 人数、性别、角色、作品
  - `@artist`
  - 发色、瞳色、发型、体型
  - 服装、道具
  - 姿势、表情、动作
  - 简洁场景锚点，如 `library, bookshelf, window`

  **不包含：**
  - 完整英文句子
  - 未确认或编造的标签（不确定是否存在的标签不得编造，应改写到 Natural Language）
  - 主体占比、画面布局和前景限制
  - 光源方向、主体曝光和色彩主次
  - `warm colors`、`dim lighting` 等自由形式的审美短语（`dim lighting` 仅在明确要求低照度时作为特定标签或自然语言使用）

  ### 默认前缀与模型版本

  - **Anima Base**（模型版本未知时默认使用）：
    `masterpiece, best quality, score_7, safe,`
  - **Anima Aesthetic**（默认不使用 `score_*`，避免对已完成美学微调的模型施加过强偏置）：
    `masterpiece, best quality, safe,`
  - **其他元标签规则**：
    - 必须包含且仅包含一个安全分级：`safe`、`sensitive`、`nsfw` 或 `explicit`。
    - `very aesthetic`、`newest`、`year 2025` 不作为强制默认标签；年代标签只在用户要求特定时期或画风时加入。
    - `ye-pop`、`deviantart` 只在用户明确要求对应的非动漫数据集风格时使用。
    - Anima Turbo 的 CFG、步数等参数由外部工作流控制，不写入提示词。

  ### 标签顺序

  [quality/meta/year/safety] → [人数] → [character] → [series] → [@artist] → [外观/服装/动作/场景标签]

  - **单人 vs 多人标签**：单人使用 `1girl` / `1boy` 及 `solo`；多人使用 `2girls`、`1girl, 1boy`、`3girls` 等精确标签，严禁在多人场景保留 `solo`，也不得用 `multiple girls` 代替已知的精确人数。
  - **多人分组排列**：多人时，先完整列出人数，再按角色连续排列身份和作品锚点；同一角色的专属外观、服装、体型和道具标签必须保持相邻，全部列完后再切换到下一角色。不要把互动标签插在角色身份之间，严禁把不同角色的同类属性交叉排列（如 `blue hair, red hair, short hair, long hair`）。

  ### 标签格式

  - 标签全部使用小写，用空格替换下划线（`score_1` 到 `score_9` 除外，保留下划线）。
  - 标签内括号使用反斜线转义（如 `\(series\)`）。
  - 画师标签必须带 `@`，最多使用三个画师。
  - 标签之间使用一个逗号和一个空格（`, `）分隔。

  ### 标签数量与裁剪策略

  以下数量是推荐的**目标范围**，不是必须满足的硬性上下限（Tag Dropout 机制意味着不需要列出所有相关标签）：

  | 场景复杂度 | 总标签数 |
  |---|---:|
  | 简单 | 16～30 |
  | 标准 | 22～38 |
  | 复杂环境、多人或剧情主视觉 | 30～48 |

  用户已有标签视为可信标签，通常不需要重新检索，但当已有标签过多或与画面冲突时，按以下顺序裁剪：

  1. **景别裁剪**：先删除与最终景别（如 `close-up`、`upper body`、`cowboy shot`）不一致、实际不会出现在画面中的身体部位、下装、鞋袜及全身姿势标签。
  2. **冲突裁剪**：删除与人数、动作、视线、姿势、服装状态或安全分级冲突的互斥标签（如 `close-up` 与 `full body`、`from front` 与 `from behind`、`looking at viewer` 与 `facing away`、`open mouth` 与 `closed mouth`、`spread fingers` 与 `clenched fist`、`spread legs` 与 `legs together`）。也包括因为遮挡而导致不可见的身体部位。比如如果人物戴着 `blindfold`，就应该删去`green_eyes`.
  3. **去重与精简**：删除宽泛标签、近义重复标签及被更准确标签覆盖的标签（如 `holding book, open book, reading` 按需精简；宽泛标签与具体标签重复时保留具体项）。
  4. **次要细节裁剪**：删除对人物区分和主要画面贡献较低的次要装饰、身体细节或场景细节。同一身体部位的细节标签不超过两个。

  应优先保留用户强调的内容、人物身份与作品、关键发型和瞳色、主要服装、核心道具、主要表情和动作。不要为了达到目标范围下限而补充无关标签；如果完成必要裁剪后仍略高于目标范围，可保留真正重要的标签。

  ### 权重规则（Prompt Weighting）

  Anima 支持括号权重语法，但仅作为辅助控制：

  - 从 `(tag:2)` 开始，必要时提高到 `(tag:3)`～`(tag:5)`，最高不得超过 5。
  - 一段提示词最多强调四个标签。
  - 不得使用权重代替主体占比、背景层级、曝光关系、剪影轮廓分离或多人属性归属。
  - `(full body:2)` 只能强化全身可见，不能保证人物足够大；背景导致景别漂移时，应先在 Natural Language 中补全构图描述，再考虑提高景别权重。
  - 多人场景中，只有在角色标签分组和自然语言锚定已经清楚时，才可谨慎强化关键特征；不得仅靠 `(blue hair:2)`、`(red hair:2)` 分离角色。

  ---

  ## 第二层：Natural Language 规范

  使用简洁、具体、可视化的英文句子，禁止为了满足句数限制制造嵌套长句或删除必要的空间信息。

  ### 句数与职责分配

  - **简单人物主导场景**：通常 2～3 句。
  - **复杂环境主视觉**：通常 3～5 句。
  - **多人物场景**：优先为每个角色单独写一句锚定句，通常 3～6 句。

  **推荐句子职责顺序：**
  1. **第一句（总起）**：景别、第一视觉主体、构图模式、主要视觉锚点和整体布局。
  2. **构图地图句**：使用画面方位（左／右／中央／上／下）与深度层级（前景／中景／远景）说明主要分区、框景元素、引导线、呼吸空间和有意出框。
  3. **人物锚定句**：
     - **单人物**：说明人物大小、画面位置、承担的功能、动作、视线、道具接触和环境的可见影响。**不要机械复述 Hard Tags 中已经明确的外观和服装。**
     - **多人物**：每个角色使用独立的短句建立角色锚点，推荐结构为：`On the left side of the image is Character A from Series A, with [各可见类别的代表性特征].` 下一角色另起一句，不得把多名角色的外观塞进同一个嵌套长句。
  4. **多人互动句**（仅多人物）：完成所有角色锚定后，用独立句子说明互动，明确写出动作发起者、承受者、接触对象和视线方向；共享属性使用 `Both characters...` 单独说明。
  5. **最后一句（光色收尾）**：主光源、光线方向、主体曝光、色彩角色和景深。

  ### 多人物跨层对齐规则

  在多人物场景中，Natural Language 负责**明确属性归属**而非完整抄写 Hard Tags：
  - 角色锚定句必须复述该角色在当前景别下可见的各个类别（发型、上衣、下装、鞋袜、道具、姿势）的**代表性特征**（每类通常1个，最多2个），将 Hard Tags 中的分组特征与具体空间方位死死绑定。
  - Hard Tags 中同类别的其余次要细节标签，在 Natural Language 中不再重复抄写。

  ### 多人物 Hybrid 推荐示例

  masterpiece, best quality, score_7, safe, 2girls, character a, series a, short black hair, blue eyes, white jacket, blue skirt, black boots, shoulder bag, standing, character b, series b, long blonde hair, red eyes, black blouse, red skirt, white boots, suitcase, standing, holding hands, railway station

  The image is divided into a left side and a right side, with both characters shown at the same readable scale. On the left side of the image is Character A from Series A, standing with short black hair, a white jacket, a blue skirt, black boots, and a shoulder bag. On the right side of the image is Character B from Series B, standing with long blonde hair, a black blouse, a red skirt, white boots, and a suitcase held in her left hand. Character A holds Character B's right hand while Character B looks at Character A. A soft side light keeps both faces clearly visible while the railway platform remains secondary in the background.

  ---

  ## Anima 格式自检清单

  输出前确认以下语法与结构要素：

  1. 是否严格遵循“单行 Hard Tags + 空一行 + 单段 Natural Language”的模型输入结构？
  2. 默认前缀是否与指定的 Anima 模型版本（Base / Aesthetic）匹配，且包含唯一的安全分级标签？
  3. Hard Tags 是否全部为小写、空格代下划线（`score_*` 除外）、括号已转义、画师带 `@` 且不超过3个？
  4. 标签是否已按景别和冲突规则完成裁剪、去重，并尽量落入目标数量范围？未确认的概念是否已移入 Natural Language 而非编造标签？
  5. 单人场景中，Natural Language 是否避免了机械复述 Hard Tags 的外观服装？
  6. 多人场景中，Hard Tags 是否严格按“精确人数 → 角色A全套属性 → 角色B全套属性 → 互动/场景”分组排列且无交叉？Natural Language 是否为每个角色使用了独立锚定句并复述了各可见类别的代表性特征？
  7. 权重是否控制在 `(tag:2)`～`(tag:5)` 且不超过4个，且没有用权重代替构图、占比或曝光描述？
  8. Natural Language 句数是否与场景复杂度匹配，且无嵌套长句？

