  # NewBie XML Prompt Format Specification

  本规范仅约束 NewBie 模型输入提示词的 XML 语法结构、标签转义与字段协同规则；画面的构图、空间、光影、因果可见性与多人物视觉逻辑须遵循《通用视觉构图与创作规范》。最终回答的包装、说明语言、解释及翻译要求由调用方指定。

  ## 核心语法原则

  NewBie 模型采用结构化 XML 树状输入，分为三个核心部分：
  1. **`character_N` 块（离散角色标签层）**：按角色独立封装结构化 Danbooru 属性。
  2. **`general_tags` 块（画面全局标签层）**：封装人数、画风、背景、氛围、质量与道具标签。
  3. **`caption` 块（空间叙事层）**：使用流畅的自然语言英文段落串联场景，负责补充硬标签难以精确表达的空间关系、光影、动作因果及八维表现力。

  ---

  ## 标签处理规则

  在 `character_N` 和 `general_tags` 块中填写的标签必须严格遵守以下语法：

  - 标签内部的空格必须替换为下划线 `_`（如 `red eyes` → `red_eyes`）。
  - 标签名内的括号必须用反斜杠转义（如 `momoko (momopoco)` → `momoko_\(momopoco\)`）。
  - 权重括号（如 `(daito:1.2)`）保持原样，不转义。
  - 括号内包含多个独立标签时，必须拆解为独立标签。
  - 多个标签之间使用逗号加空格分隔。

  ---

  ## XML 结构

  ```xml
  <img>
   <character_1>
    <n>角色名</n>
    <gender>性别标签 (如 1girl)</gender>
    <appearance>外貌特征 (发色, 瞳色, 身体特征等)</appearance>
    <clothing>衣着 (具体服饰)</clothing>
    <expression>表情</expression>
    <action>动作</action>
    <position>位置</position>
   </character_1>

   <!-- 若有多个角色，按 character_2, character_3 顺延 -->

   <general_tags>
    <count>人数标签</count>
    <style>画风标签（若用户未指定，默认 anime_style, realistic_shading）</style>
    <background>背景标签</background>
    <atmosphere>画面情绪、氛围标签</atmosphere>
    <quality>very_aesthetic, masterpiece, no_text</quality>
    <resolution>max_high_resolution</resolution>
    <artist>画师标签</artist>
    <objects>各种物品（包括武器、饰品等）</objects>
    <other>其它标签</other>
   </general_tags>

   <caption>
    将所有标签串联为一段流畅、详细的英文场景描述。包含光线、情绪、角色和背景。
    不要在此处提及 style 或 quality 类词汇。
   </caption>
  </img>
  ```

  ---

  ## XML 字段职责划分

  ### 1. `character_N` 块（离散标签层）

  负责单个角色的结构化属性，使用下划线格式的 Danbooru 标签：

  - `<n>`：角色名（经检索确认的 canonical name）。
  - `<gender>`：人数/性别标签（如 `1girl`、`1boy`）。
  - `<appearance>`：发色、瞳色、发型、体型等外观特征（经检索确认）。
  - `<clothing>`：服装、配饰（经检索确认，且须符合当前景别可见范围）。
  - `<expression>`：表情标签。
  - `<action>`：动作/姿势标签（看不见物理后果的抽象动作不写；无法明确归属的动作改写进 `<caption>`）。
  - `<position>`：空间位置（`left` / `right` / `center` / `foreground` / `background`）。

  ### 2. `general_tags` 块（画面全局标签）

  负责画面整体的结构化属性：

  - `<count>`：总人数标签（如 `solo`、`2girls`、`1girl, 1boy`；严禁 `solo` 与多人标签共存）。
  - `<style>`：画风标签。
  - `<background>`：场景/背景标签。
  - `<atmosphere>`：氛围/情绪标签。
  - `<quality>`：质量标签。
  - `<resolution>`：分辨率标签。
  - `<artist>`：画师标签。
  - `<objects>`：道具/物品标签（包括武器、饰品等）。
  - `<other>`：其他标签（如视角、景别等）。

  ### 3. `caption` 块（空间叙事层）

  负责 hard tags 难以精确表达的内容，使用自然语言：

  **包含：**
  - 镜头取景：angle, shot distance, framing
  - 光线：方向、质感、色温（背光时必须在此补充脸部补光或轮廓保护描述；单人正面默认补一句脸部清晰）
  - 色彩调性：palette, color grading
  - 空间布局：角色间的位置关系、前后层次
  - 多角色动作归属与互动
  - 手和道具的精确接触关系（接触对象、接触位置和结果）
  - 情境因果链的可见后果与八维表现力补全
  - 景深、虚化、清晰区域

  **规则：**
  - 必须是流畅的英文段落，不是标签列表。
  - 不机械重复 `character_N` 和 `general_tags` 中已出现的次要标签内容。
  - 严禁在此处提及 `style` 或 `quality` 类词汇（如 `masterpiece`、`anime style`）。
  - 使用客观、具体、视觉化的描述。
  - `<caption>` 是补全“八维表现力检查”（互动、情感、视线、联动、动势、空间、质感、因果）的主要载体，保持 `character_N` 和 `general_tags` 的结构化标签干净。

  ---

  ## 多人物防特征混淆规则（XML 协同）

  如果画面包含多个人物，必须严格遵循以下结构化规则：

  1. **角色分块隔离**：每个角色独占一个 `<character_N>` 块（`<character_1>`、`<character_2>`...），块内连续排列该角色的所有专属属性（发型、瞳色、服装、体型、表情、动作），严禁将不同角色的同类属性混写或交叉排列。
  2. **外观标签充分**：每个角色至少包含 5 个角色特征标签（必要时检索补充特征）。
  3. **双重空间锚定**：必须在每个角色的 `<position>` 字段和 `<caption>` 自然语言段落中同时明确该角色的空间位置（如左侧、右侧、前景等），且前后方位保持绝对一致。
  4. **`caption` 角色外观锚定**：在 `<caption>` 中为每个角色写一句外观锚定短语，使用 `[角色名] with [关键特征]` 的句式，明确指出视觉归属。
  5. **跨层分工**：`<caption>` 锚定关键辨识特征后，重点补充空间关系、互动动作（明确主语和宾语）、光影氛围与构图取景，不再重复抄写其余标签内容。

  ---

  ## 默认值规范

  - **质量与分辨率标签**（无特殊要求时的默认值）：
    ```xml
    <quality>very_aesthetic, masterpiece, no_text</quality>
    <resolution>max_high_resolution</resolution>
    ```
  - **画风标签**（用户未指定时的默认值）：
    ```xml
    <style>anime_style, realistic_shading</style>
    ```
  - **取景与朝向默认**：若用户未指定，默认近景人物、人物面向观众（保留 `looking_at_viewer` 或 `facing_viewer`，并在 `<caption>` 补一句脸部清晰）。若用户有描述则以用户描述为准。

  ---

  ## NewBie 格式自检清单

  输出前确认以下语法与结构要素：

  1. 是否完整包含 `<img>` 根节点，以及对应的 `<character_N>`、`<general_tags>` 和 `<caption>` 块？
  2. 所有离散标签内部的空格是否已全部替换为下划线 `_`？标签自带括号是否已用 `\` 转义（权重括号除外）？
  3. `<quality>`、`<resolution>` 和 `<style>` 是否已正确填入默认值或用户指定值？
  4. `<caption>` 是否为流畅英文段落，且未混入任何 `style` 或 `quality` 类词汇？
  5. 无法明确归属的动作、手部精确接触关系及八维补全内容，是否已正确放入 `<caption>` 而非硬塞进标签层？
  6. 多人场景中，是否按 `<character_1>`、`<character_2>` 严格分块，每个角色至少有 5 个特征标签，且在 `<position>` 与 `<caption>` 中完成了双重方位与 `[角色名] with [关键特征]` 锚定？

