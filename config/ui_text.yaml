help:
  update_title: 即将上线：API Key 与调用限额
  update_detail_label: 查看详情
  update_summary: >-
    API 即将启用 Key 申请与限流：每把 Key 默认每天 3,000 点，无 Key 调用共享每天 15,000 点试用池。网页搜索和MCP继续无需登录使用。将于10月初生效。
  update_markdown: |-
    ### API Key 与调用限额即将上线

    为保障大家的搜索体验，我们将为 API 调用引入 API Key 和使用限额。**目前申请入口尚未开放，以下额度与限流政策尚未生效；申请入口会另行公告。** 网页上的普通标签搜索继续无需登录，也无需申请 API Key。
    调用MCP接口也暂时无需申请Key。

    **生效时间？**
    
    将于2026年10月01日 00:00（北京时间）左右正式生效。

    **如何申请？**

    - 申请入口开放后，使用 Hugging Face 账号登录，填写用途和预计每日用量即可提交。ModelScope因平台资源受限，暂无法提供 Key 申请；请使用 Hugging Face 账号申请。
    - 第一把 Key 申请不超过默认 **3,000 点/日** 时可自动批准；申请第二把及后续 Key，或首把 Key 需要超过默认额度时，请填写申请原因，等待人工审核。
    - 无统一收费计划，申请 Key 仅用于区分调用者、统计使用量和保护服务容量。

    **调用如何计量？**

    | 调用内容 | 每次消耗 |
    | --- | --- |
    | 标签搜索（/search） | 3 点 |
    | 关联推荐（/related） | 2 点 |
    | 画师推荐（/artists） | 1 点 |
    | 健康检查（/health） | 0 点 |

    - **有 Key：**每把 Key 默认每天 3,000 点，相当于 1,000 次纯标签搜索；混合调用按上表累加。每把 Key 默认每分钟 60 点，最多同时处理 1 个业务请求。同一账号的不同 Key 各自独立计算日额度、分钟额度和并发上限。
    - **无 Key：**所有调用者共享每天 **15,000 点**的试用池，同时共享每分钟 30 点、最多 1 个业务请求的并发限制；公共池耗尽后，无 Key 调用需等待重置，建议长期集成申请自己的 Key。
    - 每日额度在**北京时间 00:00**重置，剩余额度不结转。超出额度、短时速率或并发限制时，请稍后重试；上线后这类请求将返回 429。
    - 不同 Key 的额度独立，但仍受服务整体容量保护，持有 Key 不保证随时能以最高速率调用。健康检查虽不扣点，也请避免频繁轮询。

    即日起，API 响应将提前附带政策提醒。

tutorial:
  title: 使用教程
  subtitle: 了解搜索、工作区、历史、收藏、导入和推荐等常用功能。
  body_markdown: |-
    ### 1. 搜索与查询理解

    搜索后的“查询理解”优化了原先的分词筛选功能，增加了是否覆盖的标记：

    - **绿色**：这个概念已有标签被加入工作区。
    - **黄色**：搜索结果中存在候选，但你还没有选择。
    - **红色**：当前结果没有覆盖；点击它会沿用当前参数发起补充搜索，不会清空工作区。
    - 点击绿色或黄色概念，可以只查看来自该概念的搜索结果；点击“全部结果”恢复完整列表。

    ### 2. 标签工作区

    勾选搜索结果、关联标签、同类标签或推荐画师后，它们都会进入同一个工作区，并自动保存在当前浏览器中。

    - 使用标签两侧的 `− / +` 调整 Prompt 权重。
    - 使用“撤销 / 恢复”回退最近的工作区修改。
    - “清空已选”只清空当前工作区标签，不会删除历史和收藏。
    - SDXL、NAI、Anima 复制格式会随工作区保存；画师标签在 Anima 格式下会自动使用 `@画师名`。

    ### 3. 历史与继续搜索

    每次搜索都会记录查询、当时的搜索设置和工作区快照：

    - **重新搜索**：恢复历史查询和当时的搜索参数，然后立即搜索。
    - **恢复工作区**：恢复当时的已选标签、权重和格式。
    - **追加查询**：使用当前页面的搜索参数重新执行历史查询，并保留当前工作区。

    ### 4. 收藏

    “保存收藏”会保存当前标签组合、权重、来源和 Prompt 格式。收藏可以恢复、合并或直接复制；合并时，同名标签保留当前工作区已有权重。

    ### 5. Prompt 导入与 Alias 纠错

    点击“导入 Prompt”后粘贴标签字符串。全角逗号和半角逗号会等价解析；上传或粘贴完成后，需要再次点击确认才会导入。

    - Alias 是 Danbooru 中标记弃用标签的数据接口，导入 Prompt 后，系统将自动替换弃用标签，并展示替换关系。
    - 重复标签会合并，不会重复加入。
    - 无法唯一识别或目标不在当前标签库中的内容进入“待确认”，不会被强行加入。

    ### 6. 关联、同类与画师推荐

    - **关联推荐**根据标签共现关系补充经常一起出现的标签。
    - **同类标签**根据 Tag Group 展示同一语义组中的其他标签。
    - **推荐擅长画师**根据标签与画师的共现数据推荐画师，每页显示 8 位；悬停可查看常见标签。

    推荐原因只展示系统实际使用的数据来源，不会虚构标签关系。

    ### 7. 备份与迁移

    “备份 / 迁移”可以导出完整 JSON，内容包括当前配置、工作区、原始搜索查询、历史和收藏。文件仅在你主动下载或上传时离开浏览器。导入时可以选择合并或替换。

    ### 8. 反馈与隐私

    你可以提交整次搜索问题或标签翻译错误。反馈只记录当前查询、搜索设置、应用版本和你主动填写的说明；不会上传浏览器指纹、收藏、完整历史或未经提交的工作区等任何个人信息。

documentation:
  title: 文档与集成
  subtitle: 查看接口文档、工具链、插件与公开服务接入说明。
  links:
